baseURL = 'https://claridelune.com/'
title = 'claridelune website'
theme = 'claridelune-theme'

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
[languages]
	[languages.en]
		label = 'English'
		locale = 'en'
		contentDir = "content/en"
		weight = 1
	[languages.es]
		label = 'Español'
		locale = 'es'
		contentDir = "content/es"
		weight = 2

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20

  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30

  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 40
